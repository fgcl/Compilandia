<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#222A2C">
  <title>Compilândia</title>
  <style>
    html, body { margin: 0; height: 100%; background: #171C1E; overflow: hidden; }
    /* O jogo ocupa a janela toda: ele mesmo escolhe o arranjo pela largura (ui/Janela.kt). */
    #jogo { position: relative; height: 100%; width: 100%; background: #222A2C; }

    /* Tela de carregamento: só HTML, aparece na hora, antes do jogo (uns 20 MB) chegar. */
    #carregando { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; box-sizing: border-box; color: #F2EEE3; font: 600 16px system-ui, sans-serif;
      background: #222A2C radial-gradient(circle, rgba(242,238,227,.07) 1.5px, transparent 1.6px) 0 0 / 22px 22px;
      transition: opacity .35s ease; }
    #carregando.some { opacity: 0; pointer-events: none; }
    #carregando svg { width: min(34vw, 150px); height: auto; }
    #carregando h1 { margin: 0; font: 800 clamp(28px, 6vw, 40px)/1 system-ui, sans-serif; letter-spacing: .01em; }
    #carregando h1 b { color: #F5B700; }
    .barra { width: min(80vw, 360px); height: 14px; border-radius: 7px; background: #1F2628; box-shadow: inset 0 0 0 2px #3A4548; overflow: hidden; }
    .barra i { display: block; height: 100%; width: 3%; border-radius: 7px; transition: width .25s ease;
      background: repeating-linear-gradient(-45deg, #F5B700 0 10px, #1F2628 10px 20px); }
    .barra.montando i { width: 100%; animation: anda 1s linear infinite; }
    @keyframes anda { to { background-position: 28px 0; } }
    #situacao { color: #B9C2C4; font-weight: 500; font-variant-numeric: tabular-nums; min-height: 1.4em; text-align: center; }
    .olho { animation: pisca 4.5s infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pisca { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) {
      .olho, .barra.montando i { animation: none; }
      #carregando, .barra i { transition: none; }
    }
  </style>
</head>
<body>
  <div id="jogo">
    <div id="carregando" role="status" aria-live="polite">
      <svg viewBox="0 0 400 480" aria-hidden="true">
        <rect x="70" y="425" width="90" height="40" rx="20" fill="#1F2628"/>
        <rect x="240" y="425" width="90" height="40" rx="20" fill="#1F2628"/>
        <g fill="#5E7076"><circle cx="86" cy="445" r="6"/><circle cx="110" cy="445" r="6"/><circle cx="134" cy="445" r="6"/>
          <circle cx="256" cy="445" r="6"/><circle cx="280" cy="445" r="6"/><circle cx="304" cy="445" r="6"/></g>
        <g transform="rotate(20 106 312)"><rect x="72" y="305" width="34" height="84" rx="17" fill="#F5B700"/><rect x="76" y="382" width="26" height="14" rx="6" fill="#1F2628"/></g>
        <g transform="rotate(-20 294 312)"><rect x="294" y="305" width="34" height="84" rx="17" fill="#F5B700"/><rect x="298" y="382" width="26" height="14" rx="6" fill="#1F2628"/></g>
        <rect x="120" y="290" width="160" height="140" rx="26" fill="#D99A0A"/>
        <rect x="120" y="290" width="160" height="124" rx="26" fill="#F5B700"/>
        <rect x="150" y="330" width="100" height="62" rx="8" fill="#1F2628"/>
        <g fill="#F5B700"><path d="M156 386L184 336H196L168 386Z"/><path d="M186 386L214 336H226L198 386Z"/><path d="M216 386L244 336H256L228 386Z"/></g>
        <line x1="200" y1="92" x2="200" y2="52" stroke="#5E7076" stroke-width="12" stroke-linecap="round"/>
        <circle cx="200" cy="44" r="16" fill="#C8432A"/><circle cx="195" cy="39" r="5" fill="#fff" fill-opacity=".45"/>
        <rect x="44" y="150" width="22" height="66" rx="10" fill="#5E7076"/><rect x="334" y="150" width="22" height="66" rx="10" fill="#5E7076"/>
        <rect x="60" y="90" width="280" height="190" rx="46" fill="#D99A0A"/>
        <rect x="60" y="90" width="280" height="176" rx="46" fill="#F5B700"/>
        <rect x="92" y="118" width="216" height="134" rx="20" fill="#1F2628"/>
        <g fill="none" stroke="#8FF5E2" stroke-width="12" stroke-linecap="round">
          <path class="olho" d="M136 182Q156 156 176 182"/><path class="olho" d="M224 182Q244 156 264 182"/>
          <path d="M166 212Q200 240 234 212"/>
        </g>
      </svg>
      <h1>Compil<b>â</b>ndia</h1>
      <div class="barra" id="barra"><i id="cheio"></i></div>
      <div id="situacao">Ligando o Byte…</div>
    </div>
  </div>
  <noscript>O Compilândia precisa de JavaScript e de um navegador com WebAssembly.</noscript>
  <script>
    // A barra conta os bytes dos .wasm enquanto chegam. O total vem do build (o tamanho já descomprimido),
    // porque o servidor pode mandar comprimido e aí o Content-Length não serve.
    (function () {
      var ingles = !/^pt/i.test(navigator.language || 'pt');
      var T = ingles ? { baixando: 'Downloading the game', montando: 'Setting up the workshop…', erro: 'Could not load. Check your connection and reload the page.' }
                     : { baixando: 'Baixando o jogo', montando: 'Montando a oficina…', erro: 'Não deu para carregar. Confira a internet e recarregue a página.' };
      var total = Number('__BYTES_WASM__') || 0, recebido = 0, abertos = 0, fim = false;
      var cheio = document.getElementById('cheio'), barra = document.getElementById('barra'), situacao = document.getElementById('situacao');
      function mostra() {
        if (fim) return;
        if (abertos === 0 && recebido > 0) { barra.className = 'barra montando'; situacao.textContent = T.montando; return; }
        var p = total ? Math.min(99, Math.floor(recebido * 100 / total)) : 0;
        cheio.style.width = Math.max(3, p) + '%';
        situacao.textContent = total ? T.baixando + ' · ' + p + '%' : T.baixando + '…';
      }
      var fetchOriginal = window.fetch;
      window.fetch = function (entrada, opcoes) {
        var url = typeof entrada === 'string' ? entrada : (entrada && entrada.url) || '';
        var promessa = fetchOriginal.apply(this, arguments);
        if (!/\.wasm(\?|$)/.test(url) || typeof ReadableStream === 'undefined') return promessa;
        abertos++; mostra();
        return promessa.then(function (r) {
          if (!r.ok || !r.body) { abertos--; return r; }
          if (!total) total += Number(r.headers.get('content-length')) || 0;
          var leitor = r.body.getReader();
          var corpo = new ReadableStream({
            pull: function (c) {
              return leitor.read().then(function (x) {
                if (x.done) { abertos--; mostra(); c.close(); return; }
                recebido += x.value.byteLength; mostra(); c.enqueue(x.value);
              });
            },
            cancel: function (m) { return leitor.cancel(m); }
          });
          return new Response(corpo, { status: r.status, statusText: r.statusText, headers: r.headers });
        }, function (e) { abertos--; fim = true; situacao.textContent = T.erro; throw e; });
      };
      // O jogo chama isto quando desenha a primeira tela (wasmJsMain/Main.kt).
      window.compilandiaPronto = function () {
        fim = true;
        window.fetch = fetchOriginal;
        var tela = document.getElementById('carregando');
        if (!tela) return;
        tela.classList.add('some');
        setTimeout(function () { tela.remove(); }, 400);
      };
      window.addEventListener('error', function () { if (!fim && recebido === 0) situacao.textContent = T.erro; });
    })();
  </script>
  <script src="compilandia.js"></script>
</body>
</html>
