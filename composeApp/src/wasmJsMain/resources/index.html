<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#222A2C">
  <title>Compilândia</title>
  <style>
    html, body { margin: 0; height: 100%; background: #171C1E; overflow: hidden; }
    /* O jogo ocupa a janela toda: ele mesmo escolhe o arranjo pela largura (ui/Janela.kt). */
    #jogo { position: relative; height: 100%; width: 100%; background: #222A2C; }
    #carregando { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #F2EEE3; font: 600 18px system-ui, sans-serif; letter-spacing: .02em; }
    #carregando b { color: #F5B700; }
  </style>
</head>
<body>
  <div id="jogo"><div id="carregando"><span>Ligando o <b>Byte</b>…</span></div></div>
  <noscript>O Compilândia precisa de JavaScript e de um navegador com WebAssembly.</noscript>
  <script src="compilandia.js"></script>
</body>
</html>
